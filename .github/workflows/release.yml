name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # goreleaser runs `make web` (see before hooks in .goreleaser.yaml) to populate internal/webui/dist.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/box/Dockerfile
          platforms: linux/amd64 # ponytail: amd64 only, add arm64 via QEMU/buildx when needed
          push: true
          tags: |
            ghcr.io/tony1908/paddock-box:latest
            ghcr.io/tony1908/paddock-box:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: images/tools
          file: images/tools/Dockerfile
          platforms: linux/amd64 # ponytail: amd64 only, add arm64 via QEMU/buildx when needed
          push: true
          tags: |
            ghcr.io/tony1908/paddock-tools:latest
            ghcr.io/tony1908/paddock-tools:${{ github.ref_name }}
