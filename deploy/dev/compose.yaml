services:
  server:
    build:
      context: ../..
      dockerfile: Dockerfile.server
    image: paddock/server:dev
    command: ["--addr", ":8080", "--data-dir", "/var/lib/paddock", "--public-url", "${PADDOCK_PUBLIC_URL:-http://localhost:8080}", "--image", "${PADDOCK_IMAGE:-paddock/box:dev}", "--snapshot-interval", "${PADDOCK_SNAPSHOT_INTERVAL:-60s}"]
    environment:
      PADDOCK_STORAGE_RESTIC_PASSWORD: ${RESTIC_PASSWORD:-paddock-dev-restic-password}
    ports:
      - "${PADDOCK_SERVER_PORT:-8080}:8080"
    volumes:
      - server-data:/var/lib/paddock
    networks:
      - paddock-net
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: Dockerfile.agent
    image: paddock/agent:dev
    privileged: true
    pid: host
    depends_on:
      - server
      - traefik
    environment:
      # The local server has no TLS; production uses wss://<server>/api/v1/agent/connect.
      PADDOCK_SERVER_URL: ${PADDOCK_SERVER_URL:-ws://server:8080/api/v1/agent/connect}
      PADDOCK_NODE_TOKEN: ${PADDOCK_NODE_TOKEN:?create a node via the API first}
      PADDOCK_FORWARD_AUTH_ADDR: 0.0.0.0:7001
      PADDOCK_FORWARD_AUTH_URL: http://agent:7001/auth/forward
      PADDOCK_RUNTIME: runc
      PADDOCK_HOST_PROC: /proc
      PADDOCK_TRAEFIK_DIR: /etc/paddock/traefik/dynamic
      RESTIC_REPOSITORY: /var/lib/paddock/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-paddock-dev-restic-password}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/containerd:/var/lib/containerd:ro
      - /var/lib/docker:/var/lib/docker:ro
      - restic-data:/var/lib/paddock/restic
      - traefik-config:/etc/paddock/traefik/dynamic
    networks:
      - paddock-net
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/paddock/traefik/dynamic
      - --providers.file.watch=true
      - --api.insecure=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-config:/etc/paddock/traefik/dynamic
    networks:
      - paddock-net
    restart: unless-stopped

volumes:
  server-data:
  restic-data:
  traefik-config:

networks:
  paddock-net:
    name: paddock-net
