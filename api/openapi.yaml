openapi: 3.1.0
info:
  title: Boxes API
  version: 1.0.0
  description: Lifecycle, execution, and installation contract for self-hosted Boxes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /machine:
    get:
      summary: Get local machine capacity and health
      responses:
        '200':
          description: Local machine status
          content:
            application/json:
              schema:
                type: object
                required: [machine]
                properties:
                  machine:
                    $ref: '#/components/schemas/Machine'

  /install/cli.ps1:
    servers:
      - url: /
    get:
      summary: Download the Windows CLI installer
      description: Returns a PowerShell script with the configured public server URL embedded. It installs the matching Windows CLI and the Boxes agent skills for the current user.
      security: []
      responses:
        "200":
          description: PowerShell installer script
          content:
            text/plain:
              schema:
                type: string
  /install/cli/{binary}:
    servers:
      - url: /
    get:
      summary: Download a Boxes CLI binary
      security: []
      parameters:
        - name: binary
          in: path
          required: true
          description: Supported binaries include boxes-darwin-arm64, boxes-darwin-amd64, boxes-linux-amd64, boxes-linux-arm64, boxes-windows-amd64.exe, and boxes-windows-arm64.exe.
          schema:
            type: string
      responses:
        "200":
          description: CLI executable
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Unsupported or uninstalled CLI binary
  /sandboxes:
    get:
      summary: List sandboxes
      parameters:
        - name: filter
          in: query
          required: false
          description: "State groups: r=provisioning/ready/idle/resuming, s=stopping/stopped, e=error/unreachable. Combine letters; omitted returns all."
          schema:
            type: string
            pattern: "^[rse]*$"
        - name: tag
          in: query
          required: false
          description: "Repeatable tag filter; all given tags must match (AND). tag=key=value matches an exact value, tag=key matches any box that has the key."
          schema:
            type: array
            items:
              type: string
              maxLength: 320
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "200":
          description: Matching sandboxes
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sandbox"
    post:
      summary: Create a sandbox
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: Created sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /sandboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    delete:
      summary: Start deleting a sandbox
      responses:
        "202":
          description: Deletion accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation: {$ref: "#/components/schemas/Operation"}
    get:
      summary: Get a sandbox
      responses:
        "200":
          description: Sandbox details
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandbox:
                    $ref: "#/components/schemas/Sandbox"
    patch:
      summary: Change auto-stop, idle-stop, or tag settings
      description: TTL and idle-stop settings are independent. idleStopSeconds accepts null or zero to disable; values must be 300 to 2592000 seconds. Hosted service requests are not counted as activity. tags replaces the whole tag map; {} clears all tags; omitting tags leaves them unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  $ref: "#/components/schemas/TTLSeconds"
                idleStopSeconds:
                  $ref: "#/components/schemas/IdleStopSeconds"
                keepSnapshots:
                  $ref: "#/components/schemas/KeepSnapshots"
                tags:
                  $ref: "#/components/schemas/SandboxTags"
                networkPolicy:
                  description: Replaces the outbound network policy; null clears it. Applied live on running boxes and on the next start otherwise.
                  oneOf:
                    - $ref: "#/components/schemas/NetworkPolicy"
                    - type: "null"
      responses:
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "200":
          description: Updated sandbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandbox:
                    $ref: "#/components/schemas/Sandbox"
  /sandboxes/{id}/resume:
    post:
      summary: Resume a stopped sandbox
      description: Omitted ttlSeconds preserves the sandbox setting; null disables auto-stop. A supplied integer resets expiration from resume time.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  $ref: "#/components/schemas/TTLSeconds"
                type:
                  $ref: "#/components/schemas/BoxSize"
      responses:
        "200":
          description: Resumed sandbox
  /sandboxes/{id}/restore:
    post:
      summary: Roll a sandbox back to one of its snapshots
      description: The snapshot must belong to this sandbox. A running sandbox is stopped (capturing a final snapshot, so the rollback can be undone) and resumed from the chosen snapshot. A stopped sandbox records the snapshot and its next resume uses it.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId]
              properties:
                snapshotId: {type: string}
      responses:
        "200":
          description: Sandbox after the rollback
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandbox:
                    $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404": {description: snapshot_not_found, the snapshot does not belong to this sandbox}
        "409": {description: sandbox_busy, the sandbox is provisioning, stopping, resuming, or deleting}
  /snapshots:
    get:
      summary: List completed snapshots across owned sandboxes
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Newest snapshots first
          content:
            application/json:
              schema:
                type: object
                required: [snapshots, nextCursor]
                properties:
                  snapshots:
                    type: array
                    items: {$ref: "#/components/schemas/Snapshot"}
                  nextCursor: {type: string}
  /snapshots/{id}/download:
    get:
      summary: Download a full snapshot archive
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Gzipped tar archive of the snapshot contents and metadata
          content:
            application/gzip:
              schema: {type: string, format: binary}
  /snapshots/{id}/file:
    get:
      summary: Download a file or directory from a snapshot
      description: A regular file is returned as bytes; a directory path is returned as a tar archive of that subtree.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: File bytes or tar archive
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/x-tar:
              schema: {type: string, format: binary}
  /sandboxes/{id}/snapshots/latest:
    get:
      summary: Get the newest completed snapshot for a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Latest snapshot, or null when none has completed
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot:
                    oneOf:
                      - $ref: "#/components/schemas/Snapshot"
                      - type: "null"
  /sandboxes/{id}/snapshots:
    get:
      summary: List completed snapshots for a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Snapshots in newest first order
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: {$ref: "#/components/schemas/Snapshot"}
  /sandboxes/{id}/fork:
    post:
      summary: Fork a sandbox from its latest snapshot
      description: Omitted ttlSeconds defaults to 3600 seconds; null disables auto-stop. Omitted keepSnapshots copies the source sandbox setting.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  $ref: "#/components/schemas/TTLSeconds"
                idleStopSeconds:
                  $ref: "#/components/schemas/IdleStopSeconds"
                keepSnapshots:
                  $ref: "#/components/schemas/KeepSnapshots"
                tags:
                  $ref: "#/components/schemas/SandboxTags"
                networkPolicy:
                  description: Replaces the outbound network policy; null clears it. Applied live on running boxes and on the next start otherwise.
                  oneOf:
                    - $ref: "#/components/schemas/NetworkPolicy"
                    - type: "null"
      responses:
        "201":
          description: Forked sandbox
  /sandboxes/{id}/snapshots/{snapshotId}:
    delete:
      summary: Permanently delete a snapshot
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: snapshotId
          in: path
          required: true
          schema: {type: string}
        - name: force
          in: query
          required: false
          description: Allow deletion of the snapshot a stopped sandbox resumes from (its newest snapshot, or a pending restore target).
          schema: {type: boolean, default: false}
      responses:
        "204": {description: Snapshot permanently deleted}
        "409": {description: Snapshot is pinned or required to resume}
  /sandboxes/{id}/usage:
    get:
      summary: Get running, command, agent, desktop, and snapshot usage
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Usage accumulated across start/stop intervals and recorded activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxUsage"
  /sandboxes/{id}/activity:
    get:
      summary: List sandbox activity, newest first
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - in: query
          name: category
          schema: {type: string, enum: [lifecycle, command, agent, access, snapshot]}
        - in: query
          name: before
          description: Opaque cursor returned as nextCursor by the previous page.
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 50, minimum: 1, maximum: 100}
      responses:
        "200":
          description: Activity records newest first, with an opaque cursor when more rows are available
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityItem"
                  nextCursor:
                    type: string
  /settings/pricing:
    get:
      summary: Get owner pricing settings
      responses:
        "200":
          description: Currency and hourly rates by size
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingSettings"}
        "403": {description: Owner role required}
    put:
      summary: Set owner pricing settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingSettings"
      responses:
        "200":
          description: Saved pricing settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingSettings"}
        "403": {description: Owner role required}
  /settings/retention:
    get:
      summary: Get zero data retention setting (owner only)
      responses:
        "200": {description: Retention setting, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}}
        "403": {description: Owner role required}
    put:
      summary: Update zero data retention setting (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
                confirm: {type: string, description: Must equal "delete archived sandbox data" when enabled is true.}
      responses:
        "200": {description: Updated retention setting}
        "400": {description: Confirmation phrase required}
        "403": {description: Owner role required}
  /sandboxes/{id}/prompt:
    post:
      summary: Queue a prompt
      description: A stopped sandbox is resumed before the prompt is queued. With stopWhenDone, the server snapshots and stops the sandbox after the run reaches a terminal event.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, provider]
              properties:
                prompt:
                  type: string
                provider:
                  type: string
                  enum: [claude, codex, opencode, pi, prime, kimi]
                model:
                  type: string
                conversationId:
                  type: string
                new:
                  type: boolean
                stopWhenDone:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Prompt queued
  /sandboxes/{id}/tcp/{port}:
    get:
      summary: Open a TCP WebSocket tunnel
      description: WebSocket tunnel to the specified port inside the sandbox.
      x-websocket: true
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: port
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 65535
      responses:
        "101":
          description: WebSocket connection established
  /settings/images:
    put:
      summary: Update default container images
      description: Owner-only. Specify one or both images; omitted values keep their current defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                boxImage:
                  type: string
                toolsImage:
                  type: string
      responses:
        "200":
          description: Current default images
          content:
            application/json:
              schema:
                type: object
                required: [boxImage, toolsImage]
                properties:
                  boxImage:
                    type: string
                  toolsImage:
                    type: string
        "400":
          description: Invalid image reference
        "403":
          description: Owner role required
  /sandboxes/{id}/artifacts:
    get:
      summary: Download a file or directory from a running sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: File bytes or a gzip tar archive for a directory
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
            application/gzip: {schema: {type: string, format: binary}}
  /api-keys/{id}/usage:
    get:
      summary: Get API key usage for the last 30 days
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Request and sandbox usage totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: {$ref: "#/components/schemas/APIKeyUsage"}
  /webhooks/{id}/rotate-secret:
    post:
      summary: Rotate a webhook signing secret
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: New signing secret, returned once
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: {type: string}
  /operations/{id}:
    get:
      summary: Get an asynchronous operation
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Operation status and optional error
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation: {$ref: "#/components/schemas/Operation"}
  /agent/connect:
    get:
      summary: Authenticated agent WebSocket connection
      responses:
        "200": {description: Successful response}
  /auth/signup:
    post:
      summary: Create an account
      description: The first account requires the one-time setup token from the installer. Later accounts require owner authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 12}
                setupToken: {type: string, description: Required for the first owner account only.}
      responses:
        "201": {description: Account created}
        "403": {description: Setup token required or owner authorization required}
        "429": {description: Too many authentication attempts}
  /auth/status:
    get:
      summary: Check whether initial owner setup is required
      security: []
      responses:
        "200":
          description: Owner setup state
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired: {type: boolean}
  /auth/login:
    post:
      summary: Log in
      responses:
        "200": {description: Successful response}
        "429": {description: Too many authentication attempts}
  /auth/logout:
    post:
      summary: Log out
      responses:
        "200": {description: Successful response}
  /me:
    get:
      summary: Get the current user
      responses:
        "200": {description: Successful response}
  /api-keys:
    get:
      summary: List API keys
      responses:
        "200": {description: Successful response}
    post:
      summary: Create an API key
      responses:
        "200": {description: Successful response}
  /api-keys/{id}:
    delete:
      summary: Revoke an API key
      responses:
        "204": {description: Request completed}
  /sandboxes/{id}/stop:
    post:
      summary: Stop a sandbox
      responses:
        "200": {description: Successful response}
  /sandboxes/{id}/commands:
    post:
      summary: Execute a command in a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: Command completed
          content:
            application/json:
              schema:
                type: object
                required: [exitCode, stdout, stderr]
                properties:
                  exitCode: {type: integer}
                  stdout: {type: string}
                  stderr: {type: string}
        "202":
          description: Detached command started
          content:
            application/json:
              schema:
                type: object
                required: [processId]
                properties:
                  processId: {type: string}
        "400":
          $ref: "#/components/responses/InvalidRequest"
    get:
      summary: List detached commands for a sandbox
      description: Lists commands the agent still remembers. Finished commands are kept for one hour, up to 100 per sandbox. The list is lost if the agent restarts.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Detached commands, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items:
                      type: object
                      required: [processId, cmd, running, startedAt]
                      properties:
                        processId: {type: string}
                        cmd: {type: string}
                        running: {type: boolean}
                        exitCode: {type: integer, nullable: true}
                        startedAt: {type: string, format: date-time}
  /sandboxes/{id}/commands/{pid}:
    get:
      summary: Get a detached command result
      description: Returns output produced so far, even while the command is running. Stdout and stderr each keep the last 1 MiB; the *Offset fields are total bytes written, and *Truncated is true when earlier output was dropped.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: pid
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Current or completed command result
          content:
            application/json:
              schema:
                type: object
                required: [running, stdout, stderr, stdoutOffset, stderrOffset, cmd, startedAt]
                properties:
                  running: {type: boolean}
                  exitCode: {type: integer}
                  cmd: {type: string}
                  startedAt: {type: string, format: date-time}
                  stdout: {type: string}
                  stderr: {type: string}
                  stdoutOffset: {type: integer, minimum: 0}
                  stderrOffset: {type: integer, minimum: 0}
                  stdoutTruncated: {type: boolean}
                  stderrTruncated: {type: boolean}
        "404": {description: Command process was not found}
  /sandboxes/{id}/commands/{pid}/logs:
    get:
      summary: Stream detached command output as NDJSON
      description: |
        Each line is {"stream":"stdout"|"stderr","data":"...","offset":N}, with "truncated":true when output before the retained window was dropped. Pass stdoutOffset/stderrOffset from the last line to resume. With follow=1 the stream stays open until the command exits, then ends with {"exit":true,"exitCode":N}. Follow ends at the command's timeout at the latest. Without follow it returns the available output and ends.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: pid
          in: path
          required: true
          schema: {type: string}
        - name: stdoutOffset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: stderrOffset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: follow
          in: query
          schema: {type: string, enum: ["1"]}
      responses:
        "200":
          description: NDJSON log lines
          content:
            application/x-ndjson:
              schema: {type: string}
        "404": {description: Command process was not found}
  /sandboxes/{id}/commands/{pid}/kill:
    post:
      summary: Send a signal to a running detached command
      description: Signals the command's process group inside the sandbox.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: pid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signal: {type: string, enum: [TERM, KILL, INT, HUP, QUIT, USR1, USR2], default: TERM}
      responses:
        "200":
          description: Signal sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  processId: {type: string}
                  signal: {type: string}
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404": {description: Command process was not found}
        "409": {description: Command is not running}
  /sandboxes/{id}/commands/{pid}/stdin:
    post:
      summary: Write to a detached command's stdin
      description: Writes the raw request body (at most 1 MiB) to stdin. Requires stdin:true when the command was started. Write times out after 30 seconds (504). Stdin contents are never recorded in activity.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: pid
          in: path
          required: true
          schema: {type: string}
        - name: close
          in: query
          description: Set to 1 to close stdin after writing.
          schema: {type: string, enum: ["1"]}
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Bytes written
          content:
            application/json:
              schema:
                type: object
                properties:
                  bytes: {type: integer, minimum: 0}
                  closed: {type: boolean}
        "409": {description: Stdin was not enabled for this command or is already closed}
        "413": {description: Body exceeds 1 MiB}
        "504": {description: Process did not accept stdin within 30 seconds}
  /sandboxes/{id}/boxd/{path}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - name: path
        in: path
        required: true
        description: Remaining boxd endpoint path.
        schema: {type: string}
    get:
      summary: Proxy a GET request to boxd
      responses:
        "200": {description: Response from boxd}
    post:
      summary: Proxy a POST request to boxd
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Response from boxd}
    put:
      summary: Proxy a PUT request to boxd
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Response from boxd}
    patch:
      summary: Proxy a PATCH request to boxd
      requestBody:
        required: false
        content:
          application/json:
