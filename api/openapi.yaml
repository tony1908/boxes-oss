components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SandboxID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Invalid request body or lifecycle value
  schemas:
    Machine:
      type: object
      required: [cpus, memoryBytes, memAvailableBytes, diskFreeBytes, swapFreeBytes, memoryPressureSomeAvg10, status, runningBoxes, lastSeen]
      properties:
        cpus: {type: integer, minimum: 0}
        memoryBytes: {type: integer, minimum: 0}
        memAvailableBytes: {type: integer, minimum: 0}
        diskFreeBytes: {type: integer, minimum: 0}
        swapFreeBytes: {type: integer, minimum: 0}
        memoryPressureSomeAvg10: {type: number, minimum: 0}
        status: {type: string, enum: [healthy, unhealthy]}
        runningBoxes: {type: integer, minimum: 0}
        lastSeen: {type: string, format: date-time}
    CommandRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          oneOf:
            - type: string
              minLength: 1
              description: Shell command string executed through bash -lc.
            - type: array
              minItems: 1
              items: {type: string}
              description: Argument vector executed directly without a shell.
        cwd: {type: string}
        user: {type: string}
        env:
          type: object
          additionalProperties: {type: string}
        timeoutSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: "Zero uses the default: 300s for sync commands, 3600s for detached. Sync commands allow at most 600; detached commands allow at most 86400."
        detached: {type: boolean, default: false}
        stdin:
          type: boolean
          default: false
          description: Detached commands only (400 otherwise). Write to stdin with POST /sandboxes/{id}/commands/{pid}/stdin.
    Snapshot:
      type: object
      required: [id, boxId, resticId, sizeBytes, createdAt]
      properties:
        id: {type: string}
        boxId: {type: string}
        resticId: {type: string}
        sizeBytes: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    Operation:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string, enum: [pending, done, failed]}
        error: {type: string}
    APIKeyUsage:
      type: object
      required: [requests, sandboxesCreated]
      properties:
        requests: {type: integer, minimum: 0}
        sandboxesCreated: {type: integer, minimum: 0}
    ActivityItem:
      type: object
      required: [id, time, actorType, actorLabel, category, action, detail]
      properties:
        id: {type: string}
        time: {type: string, format: date-time}
        actorType: {type: string, enum: [user, api_key, system]}
        actorLabel: {type: string}
        category: {type: string, enum: [lifecycle, command, agent, access, snapshot]}
        action: {type: string}
        detail: {type: object, additionalProperties: true}
        durationMs: {type: integer, minimum: 0}
        outcome: {type: string, enum: [ok, error]}
    UsageCounters:
      type: object
      required: [cpuSeconds, rxBytes, txBytes]
      properties:
        cpuSeconds: {type: number, minimum: 0, description: Cumulative container CPU time in seconds}
        rxBytes: {type: integer, minimum: 0, description: Cumulative received bytes on the box network, excluding loopback}
        txBytes: {type: integer, minimum: 0, description: Cumulative transmitted bytes on the box network, excluding loopback}
    SandboxUsage:
      type: object
      required: [runningSeconds, runningSecondsThisMonth, perDay, commandsCount, agentRunsCount, desktopSessionsCount, snapshotsCount, totals]
      properties:
        live:
          $ref: "#/components/schemas/UsageCounters"
          description: Counters of the running container. Present only while the box is running and its agent answers.
        totals:
          $ref: "#/components/schemas/UsageCounters"
          description: Counters accumulated at each stop, plus live when present. Counters reset when a container is recreated, so a crash between stops loses that session.
        runningSeconds: {type: integer, minimum: 0}
        runningSecondsThisMonth: {type: integer, minimum: 0}
        perDay:
          type: array
          items:
            type: object
            required: [date, runningSeconds]
            properties:
              date: {type: string, format: date}
              runningSeconds: {type: integer, minimum: 0}
        commandsCount: {type: integer, minimum: 0}
        agentRunsCount: {type: integer, minimum: 0}
        desktopSessionsCount: {type: integer, minimum: 0}
        snapshotsCount: {type: integer, minimum: 0}
        snapshotsBytes: {type: integer, minimum: 0}
        since:
          type: [string, "null"]
          format: date-time
          description: Start of the current running interval, or null while stopped.
        estimatedCost:
          type: object
          required: [currency, amount, hourlyRate]
          properties:
            currency: {type: string}
            amount: {type: number, minimum: 0}
            hourlyRate: {type: number, minimum: 0}
    PricingSettings:
      type: object
      required: [currency, hourlyBySize]
      properties:
        currency: {type: string, default: USD}
        hourlyBySize:
          type: object
          properties:
            xsmall: {type: number, minimum: 0}
            small: {type: number, minimum: 0}
            default: {type: number, minimum: 0}
            large: {type: number, minimum: 0}
            xlarge: {type: number, minimum: 0}
    TTLSeconds:
      oneOf:
        - type: integer
          minimum: 60
          description: Values above 2592000 are capped at 2592000 seconds.
        - type: "null"
          description: Disable auto-stop.
    KeepSnapshots:
      type: integer
      minimum: 0
      maximum: 50
      description: Automatic snapshots retained per sandbox, 1 to 50. 0 (or omitted) uses the default of 5. Named snapshots are never pruned.
    IdleStopSeconds:
      oneOf:
        - type: integer
          minimum: 300
          maximum: 2592000
        - type: integer
          const: 0
        - type: "null"
      description: Idle duration in seconds; null or zero disables idle stop.
    BoxSize:
      type: string
      enum: [xsmall, small, default, large, xlarge]
      description: "CPU count and hard memory cap: xsmall 1/2 GiB, small 2/4 GiB, default 4/8 GiB, large 8/16 GiB, xlarge 16/32 GiB. Each size has a smaller soft memory reservation for scheduler admission."
    CreateSandboxRequest:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/BoxSize"
          default: default
        image:
          type: string
          maxLength: 255
          description: Container image for this box, a reference like ghcr.io/you/box:tag. Must be built FROM ghcr.io/tony1908/boxes-box so boxd is present; otherwise the box never becomes ready (box_not_ready). Omitted uses the server default box image. Invalid references return 400 invalid_image. Forks always use the source box image.
        ttlSeconds:
          allOf:
            - $ref: "#/components/schemas/TTLSeconds"
          description: Omitted defaults to 3600 seconds; null disables auto-stop.
        idleStopSeconds:
          $ref: "#/components/schemas/IdleStopSeconds"
        keepSnapshots:
          $ref: "#/components/schemas/KeepSnapshots"
        env:
          type: object
          maxProperties: 100
          description: Environment variables; key/value payload is limited to 64 KiB.
          additionalProperties:
            type: string
        setupScript:
          type: string
          maxLength: 65536
          description: Setup script run once by boxd after readiness in the background.
        from:
          type: string
          description: Named snapshot to restore.
        environment:
          type: string
        noEnv:
          type: boolean
        tags:
          $ref: "#/components/schemas/SandboxTags"
        networkPolicy:
          $ref: "#/components/schemas/NetworkPolicy"
        source:
          $ref: "#/components/schemas/SandboxSource"
    SandboxSource:
      type: object
      description: "Project files placed in the sandbox once on first boot, before setupScript runs. git clones a repository into /config/<path>; tarball downloads a .tar.gz and extracts it into /config/<path>. Only https URLs are accepted (no ssh or git@ URLs, no embedded credentials). Private repositories use token, which is sent to the box as a secret file, removed after cloning, and never returned or stored by the platform. Forks reject source. Git depth limits clone history. A revision that is a commit SHA is checked out detached after a full clone. Tarball sources are .tar.gz only."
      required: [type, url]
      properties:
        type:
          type: string
          enum: [git, tarball]
        url:
          type: string
          pattern: "^https://"
          maxLength: 2048
        revision:
          type: string
          description: "git only. Branch, tag, or commit SHA."
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$"
        depth:
          type: integer
          minimum: 1
          maximum: 1000
          description: "git only. Shallow clone depth."
        token:
          type: string
          maxLength: 4096
          writeOnly: true
          description: "git only. Token for a private repository; never returned."
        path:
          type: string
          default: project
          description: "Directory name under /config (may be nested; no leading slash, no '..', no dot-prefixed segments)."
    NetworkPolicy:
      type: object
      description: "Outbound network policy for a box. Modes: allow-all (default), deny-all (no new outbound connections), allowlist (only allowDomains and allowCidrs). denyCidrs win in every mode, and 169.254.169.254/32 is always blocked. Limits: at most 64 domains and 64 CIDRs per list; IPv4 only. Domains are hostnames or *.example.com. Limits of the allowlist: domains are resolved on the node and the resolved IPv4 addresses are re-resolved every 60 seconds, so CDN IP rotation can break connections between refreshes. Wildcard subdomains match only the apex domain (*.x.com resolves x.com). DNS lookups (UDP and TCP port 53) are not blocked in allowlist mode. allowDomains and allowCidrs are ignored in deny-all and allow-all."
      required: [mode]
      properties:
        mode:
          type: string
          enum: [allow-all, deny-all, allowlist]
        allowDomains:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 253
        allowCidrs:
          type: array
          maxItems: 64
          items:
            type: string
            description: IPv4 CIDR such as 10.0.0.0/8
        denyCidrs:
          type: array
          maxItems: 64
          items:
            type: string
            description: IPv4 CIDR such as 10.0.0.0/8
    SandboxTags:
      type: object
      description: Up to 10 key/value tags. Keys match ^[a-z0-9][a-z0-9_.-]{0,62}$; values are at most 255 characters with no control characters. Forks copy the source sandbox tags unless tags are given.
      maxProperties: 10
      propertyNames:
        pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$"
      additionalProperties:
        type: string
        maxLength: 255
    Sandbox:
      type: object
      required: [id, state, autoStop, ttlSeconds, idleStopSeconds, expiresAt, ttlRemainingSeconds, lastSnapshotAt, desktopAvailable, runningSeconds, setupStatus]
      properties:
        image:
          type: string
          description: Container image the box runs.
        keepSnapshots:
          $ref: "#/components/schemas/KeepSnapshots"
        tags:
          $ref: "#/components/schemas/SandboxTags"
        networkPolicy:
          oneOf:
            - $ref: "#/components/schemas/NetworkPolicy"
            - type: "null"
        source:
          type: object
          description: Where the project files came from. The token is never included.
          required: [type, url, path]
          properties:
            type:
              type: string
              enum: [git, tarball]
            url:
              type: string
            revision:
              type: string
            path:
              type: string
        id:
          type: string
        nodeId:
          type: string
        type:
          $ref: "#/components/schemas/BoxSize"
        state:
          type: string
        autoStop:
          type: boolean
        ttlSeconds:
          $ref: "#/components/schemas/TTLSeconds"
        idleStopSeconds:
          $ref: "#/components/schemas/IdleStopSeconds"
        expiresAt:
          type: [string, "null"]
          format: date-time
        ttlRemainingSeconds:
          type: [integer, "null"]
          minimum: 0
          description: Seconds until auto-stop, or null when auto-stop is disabled.
        lastSnapshotAt:
          type: [string, "null"]
          format: date-time
        desktopAvailable:
          type: boolean
        runningSeconds:
          type: integer
          minimum: 0
        setupStatus:
          type: string
          enum: [none, running, succeeded, failed]
        createdAt:
          type: string
          format: date-time
